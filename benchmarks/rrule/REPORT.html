    --ink-2: #c3c2b7;

  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 56px; display: grid; gap: 20px; }

  .eyebrow { font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

  .facts b { color: var(--ink); font-weight: 600; }

  .control { display: flex; align-items: center; gap: 8px; }
  .control-label { font: 500 11px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

  .check input { accent-color: var(--accent); margin: 0; }
  button:focus-visible, input:focus-visible, .pt:focus-visible, th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; }
  .highlights { position: relative; display: grid; gap: 12px; }
  .hl-heading { margin: 0; padding-bottom: 10px; border-bottom: 1px solid var(--grid); font-size: 16px; font-weight: 600; }
  .hl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .hl-card { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 18px 18px 6px; display: grid; gap: 4px; align-content: start; }
  .hl-top { display: flex; align-items: center; gap: 10px; }
  .hl-sq { width: 14px; height: 14px; border-radius: 3px; background: var(--c); flex: none; }
  .hl-card h3 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .hl-pill { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--accent); background: var(--accent-wash); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .hl-sub { font-size: 12px; color: var(--ink-2); min-height: 2.5em; }

  .hl-empty { color: var(--ink-2); font-size: 14px; padding: 12px 0; }
  .chart-controls { padding: 0 4px 10px; }
  .chart-card { position: relative; padding: 16px 16px 8px; }

  .chart-title { font-weight: 600; font-size: 15px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); align-items: center; }
  .key { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .key svg { flex: none; width: auto; }
  svg { display: block; width: 100%; overflow: visible; }
  .empty { padding: 48px 16px; text-align: center; color: var(--ink-2); }

  .pill.bad { --pill: var(--critical); }
  .pill.run { --pill: var(--accent); }

  tokens: (v) => (v == null ? '—' : v >= 1e6 ? nf(2).format(v / 1e6) + ' M' : v >= 1e3 ? nf(1).format(v / 1e3) + ' k' : String(v)),
  steps: (v) => (v == null ? '—' : String(v)),
  time: (ms) => {
    if (ms == null) return '—';
    const s = Math.round(ms / 1000), m = Math.floor(s / 60);
    return m ? `${m} min ${String(s % 60).padStart(2, '0')} s` : `${s} s`;
  },
  score: (v) => (v == null ? '—' : nf(1).format(v)),
  pct: (v) => (v == null ? '—' : nf(0).format(v) + ' %'),
};

const X = {
  cost: { label: 'Coste', title: 'coste por tarea', get: (m) => m.cost, f: fmt.cost, unit: 'USD, precio de lista según opencode' },
  tokens: { label: 'Tokens generados', title: 'tokens generados', get: (m) => m.tokensOut, f: fmt.tokens, unit: 'salida + razonamiento' },
  steps: { label: 'Pasos', title: 'pasos del agente', get: (m) => m.steps, f: fmt.steps, unit: 'llamadas al modelo' },
  time: { label: 'Tiempo', title: 'tiempo activo', get: (m) => m.activeMs, f: fmt.time, unit: 'minutos' },
};
const Y = {
  score: { label: 'Nota', title: 'Nota (0–10)', get: (m) => scoreOf(m), f: fmt.score, max: 10 },
  hidden: { label: 'Suite oculta', title: 'Suite oculta (% de casos)', get: (m) => (m.hidden ? (100 * m.hidden.passed) / m.hidden.total : null), f: fmt.pct, max: 100 },
};

const store = {
  get(k, d) { try { return localStorage.getItem('rep:' + k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('rep:' + k, v); } catch {} },
};
const state = { x: store.get('x', 'cost'), y: store.get('y', 'score'), log: store.get('log', '0') === '1', sort: 'score', dir: -1 };
if (!X[state.x]) state.x = 'cost';
if (!Y[state.y]) state.y = 'score';

// ---------- pesos de la nota ----------
// La nota oficial usa los pesos de bench.json. El lector puede cambiarlos: cada modelo trae la proporción que
// consiguió en cada bloque (0-1) y la nota se recalcula reescalada a 0-10 (más la penalización, si la hay).
const BLOCKS = [
  ['correctness', 'Corrección (suite oculta)'],
  ['autonomy', 'Autonomía'],
  ['ownTests', 'Tests propios'],
  ['codeQuality', 'Calidad de código'],
  ['robustness', 'Robustez'],
];
const PRESETS = [
  ['Oficial', null],
  ['Solo suite oculta', { correctness: 1 }],
  ['Código y tests', { ownTests: 1, codeQuality: 1 }],
  ['Sin juez', { correctness: 1, autonomy: 1, robustness: 1 }],
];
const weights = {};
function wOf(test) {
  if (!weights[test.test]) {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('rep:w:' + test.test) || 'null'); } catch {}
    weights[test.test] = { ...test.weights, ...(saved ?? {}) };
  }
  return weights[test.test];
}
function saveW() { try { localStorage.setItem('rep:w:' + cur.test, JSON.stringify(wOf(cur))); } catch {} }
const isCustom = () => BLOCKS.some(([k]) => Number(wOf(cur)[k] ?? 0) !== Number(cur.weights[k] ?? 0));
function scoreOf(m) {
  if (m.score == null) return null;
  if (!isCustom() || !m.fractions) return m.score;
  const w = wOf(cur);
  const sum = BLOCKS.reduce((a, [k]) => a + Number(w[k] || 0), 0);
  if (!sum) return null;
  const raw = (BLOCKS.reduce((a, [k]) => a + Number(w[k] || 0) * (m.fractions[k] ?? 0), 0) / sum) * 10 + (m.penalty || 0);
  return Math.round(Math.max(0, Math.min(10, raw)) * 10) / 10;
}

// Pesos de un preset repartidos para sumar 10, en pasos de 0,5 como los deslizadores (Oficial = bench.json).
function presetTarget(p) {
  if (!p) return cur.weights;
  const total = Object.values(p).reduce((a, b) => a + b, 0);
  return Object.fromEntries(BLOCKS.map(([k]) => [k, Math.round(((p[k] ?? 0) * 10) / total * 2) / 2]));
}

function weightsPanel() {
  const grid = document.getElementById('wgrid');
  grid.replaceChildren();
  const w = wOf(cur);
  for (const [k, label] of BLOCKS) {
    const item = el('div', { class: 'w-item' });
    const id = 'w-' + k;
    const lab = el('label', { class: 'w-label', for: id });
    const out = el('output', { for: id }, String(w[k] ?? 0));
    lab.append(label, out);
    const input = el('input', { type: 'range', id, min: '0', max: '10', step: '0.5', value: String(w[k] ?? 0) });
    input.addEventListener('input', () => {
      w[k] = Number(input.value);
      out.textContent = input.value;
      saveW();
      afterWeights();
    });
    item.append(lab, input);
    grid.append(item);
  }
  const pre = document.getElementById('wpresets');
  pre.replaceChildren();
  for (const [name, p] of PRESETS) {
    const target = presetTarget(p);
    const active = BLOCKS.every(([k]) => Number(w[k] ?? 0) === Number(target[k] ?? 0));
    const b = el('button', { type: 'button', 'aria-pressed': String(active) }, name);
    b.addEventListener('click', () => {
      for (const [k] of BLOCKS) w[k] = Number(target[k] ?? 0);
      saveW();
      weightsPanel();
      afterWeights();
    });
    pre.append(b);
  }
  noteW();
}
function noteW() {
  const n = document.getElementById('wnote');
  n.replaceChildren();
  const sum = BLOCKS.reduce((a, [k]) => a + Number(wOf(cur)[k] || 0), 0);
  if (isCustom()) {
    n.append(el('b', {}, 'Pesos personalizados'), ` · suman ${fmt.score(sum)}; la nota se reescala a 0–10. La tabla y el gráfico usan esta nota.`);
  } else {
    n.append('Pesos oficiales de la prueba. Muévelos para ver cómo cambia la clasificación.');
  }
}
function afterWeights() {
  noteW();
  header();
  render();
  // Resalta el preset que coincida (sin reconstruir los deslizadores mientras se arrastran).
  const w = wOf(cur);
  const btns = document.getElementById('wpresets').children;
  PRESETS.forEach(([, p], i) => {
    const target = presetTarget(p);
    btns[i]?.setAttribute('aria-pressed', String(BLOCKS.every(([k]) => Number(w[k] ?? 0) === Number(target[k] ?? 0))));
  });
}

const el = (tag, attrs = {}, text) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text != null) n.textContent = text;
  return n;
};
const sv = (tag, attrs = {}) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};

// ---------- cabecera ----------
function header() {
  document.getElementById('facts').replaceChildren();
  const desc = document.getElementById('desc');
  desc.textContent = cur.description ?? '';
  desc.hidden = !cur.description;
  const links = document.getElementById('links');
  links.replaceChildren(...(cur.links ?? []).map(([label, href]) => el('a', { href }, label)));
  links.hidden = !(cur.links ?? []).length;
  document.getElementById('eyebrow').textContent = `${DATA.eyebrow ?? 'Benchmark de modelos de programación'} · prueba ${cur.short ?? cur.test}`;
  document.getElementById('title').textContent = DATA.siteTitle ?? cur.title;
  const scored = cur.models.filter((m) => scoreOf(m) != null);
  const best = [...scored].sort((a, b) => scoreOf(b) - scoreOf(a))[0];
  const facts = document.getElementById('facts');
  const add = (label, value) => {
    const s = el('span');
    s.append(label + ' ');
    s.append(el('b', {}, value));
    facts.append(s);
  };
  add('Modelos con nota', `${scored.length} de ${cur.models.length}`);
  if (best) add('Mejor nota', `${best.name} · ${fmt.score(scoreOf(best))}`);
  add('Suite oculta', `${cur.hiddenTotal} casos`);
  add('Juez', cur.judge);
  if (cur.generatedAt) add('Actualizado', new Date(cur.generatedAt).toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' }));
}

// ---------- controles ----------
function controls() {
  const seg = (id, opts, key) => {
    const box = document.getElementById(id);
    box.replaceChildren();
    for (const [k, o] of Object.entries(opts)) {
      const b = el('button', { type: 'button', 'aria-pressed': String(state[key] === k) }, o.label);
      b.addEventListener('click', () => {
        state[key] = k;
        store.set(key, k);
        controls();
        render();
      });
      box.append(b);
    }
  };
  document.getElementById('topctl').hidden = TESTS.length < 2;
  const tseg = document.getElementById('tseg');
  tseg.replaceChildren();
  for (const t of TESTS) {
    const b = el('button', { type: 'button', 'aria-pressed': String(t === cur) }, t.short ?? t.test.toUpperCase());
    b.addEventListener('click', () => selectTest(t));
    tseg.append(b);
  }
  seg('xseg', X, 'x');
  seg('yseg', Y, 'y');
  const log = document.getElementById('logx');
  log.checked = state.log;
  log.onchange = () => {
    state.log = log.checked;
    store.set('log', log.checked ? '1' : '0');
    render();
  };
}

// ---------- escalas ----------
function niceStep(span, target) {
  const raw = span / target, mag = 10 ** Math.floor(Math.log10(raw)), r = raw / mag;
  return (r >= 5 ? 10 : r >= 2 ? 5 : r >= 1 ? 2 : 1) * mag;
}
function linTicks(lo, hi, n) {
  const st = niceStep(hi - lo, n), out = [];
  for (let v = Math.ceil(lo / st) * st; v <= hi + st * 1e-9; v += st) out.push(+v.toPrecision(12));
  return out;
}
function logTicks(lo, hi) {
  const out = [];
  for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++)
    for (const m of [1, 2, 5]) { const v = m * 10 ** e; if (v >= lo * 0.999 && v <= hi * 1.001) out.push(v); }
  return out;
}

// Frontera de Pareto: nadie tiene a la vez más (o igual) Y y menos (o igual) X.
function frontier(points) {
  const s = [...points].sort((a, b) => a.x - b.x || b.y - a.y);
  const out = new Set();
  let best = -Infinity;
  for (const p of s) if (p.y > best) { out.add(p.m.slug); best = p.y; }
  return out;
}

let points = [], front = new Set();

// ---------- destacados (top 10 por métrica, estilo "highlights") ----------
const HL = [
  { title: 'Nota', color: 'var(--accent)', sub: () => (isCustom() ? 'Nota 0–10 con tus pesos · más es mejor' : 'Nota 0–10 · más es mejor'),
    get: (m) => scoreOf(m), f: (v) => nf(1).format(v), asc: false },
  { title: 'Velocidad', color: 'var(--hl-speed)', sub: () => 'Tokens generados por segundo de trabajo del agente · más es mejor',
    get: (m) => (m.tokensOut && m.activeMs ? m.tokensOut / (m.activeMs / 1000) : null), f: (v) => nf(0).format(v), asc: false },
  { title: 'Coste por tarea', color: 'var(--hl-cost)', sub: () => 'USD por tarea, precio de lista según opencode · menos es mejor',
    get: (m) => m.cost, f: (v) => (v < 0.1 ? nf(3) : nf(2)).format(v), tipF: (v) => fmt.cost(v), asc: true },
];

function drawHighlights() {
  const grid = document.getElementById('hlgrid');
  grid.replaceChildren();
  hideHTip();
  const models = cur.models.filter((m) => scoreOf(m) != null);
  if (!models.length) {
    grid.append(el('div', { class: 'hl-empty' }, 'Todavía no hay modelos con nota en esta prueba.'));
    return;
  }
  HL.forEach((h, i) => {
    const card = el('article', { class: 'hl-card', style: `--c:${h.color}` });
    const top = el('div', { class: 'hl-top' });
    top.append(el('span', { class: 'hl-sq', 'aria-hidden': 'true' }), el('h3', {}, h.title));
    if (i === 0 && cur.generatedAt) top.append(el('span', { class: 'hl-pill' }, 'Actualizado ' + new Date(cur.generatedAt).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' })));
    const plot = el('div', { class: 'hl-plot' });
    card.append(top, el('div', { class: 'hl-sub' }, h.sub()), plot);
    grid.append(card);
    h.plot = plot;
    h.vals = models
      .map((m) => ({ m, v: h.get(m) }))
      .filter((x) => x.v != null && Number.isFinite(x.v))
      .sort((a, b) => (h.asc ? a.v - b.v : b.v - a.v) || byRank(a.m, b.m))
      .slice(0, 10);
  });
  for (const h of HL) drawBars(h.plot, h.vals, h);
}

function drawBars(box, vals, h) {
  // Etiquetas giradas 45°: el margen inferior y el izquierdo se calculan con su ancho real para que no se salgan.
  const labFont = '400 11px "IBM Plex Sans", system-ui, sans-serif';
  const lw = vals.map((x) => textW(x.m.name, labFont) * Math.SQRT1_2);
  const W = Math.max(260, box.clientWidth), n = Math.max(vals.length, 1);
  const M = { top: 22, right: 4, bottom: Math.max(60, Math.ceil(Math.max(0, ...lw)) + 24), left: 4 };
  const slot0 = (W - M.left - M.right) / n;
  M.left = Math.max(4, Math.ceil(Math.max(...lw.map((w, i) => w - slot0 * (i + 0.5) + 2), 0)));
  const pw = W - M.left - M.right;
  const max = Math.max(...vals.map((x) => x.v)) || 1;
  const slot = pw / n, bw = Math.min(24, slot * 0.64), r = Math.min(4, bw / 2);
  // Si alguna cifra no cabe sobre su barra, todas las del panel van en vertical.
  const valFont = '500 10.5px "IBM Plex Mono", ui-monospace, monospace';
  const valW = Math.max(...vals.map((x) => textW(h.f(x.v), valFont)));
  const rot = valW > slot - 3;
  const ph = 164;
  M.top = rot ? Math.ceil(valW) + 12 : 22;
  const H = M.top + ph + M.bottom;
  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `${h.title}: ${vals.map((x) => `${x.m.name} ${h.f(x.v)}`).join(', ')}` });
  for (const f of [1 / 3, 2 / 3, 1]) {
    const y = M.top + ph * (1 - f);
    svg.append(sv('line', { x1: M.left, x2: M.left + pw, y1: y, y2: y, stroke: 'var(--grid)', 'stroke-width': 1 }));
  }
  const base = M.top + ph;
  svg.append(sv('line', { x1: M.left, x2: M.left + pw, y1: base, y2: base, stroke: 'var(--axis)', 'stroke-width': 1 }));
  vals.forEach((x, i) => {
    const cx = M.left + slot * (i + 0.5), bh = Math.max(2, (x.v / max) * ph), y = base - bh, x0 = cx - bw / 2, x1 = cx + bw / 2;
    const g = sv('g', { class: 'bar-g' });
    const hit = sv('rect', { class: 'bar-hit', x: cx - slot / 2, y: M.top - 18, width: slot, height: ph + M.bottom + 18, fill: 'transparent', tabindex: 0,
      role: 'img', 'aria-label': `${x.m.name}: ${h.f(x.v)}` });
    const bar = sv('path', { class: 'bar', fill: h.color,
      d: `M${x0},${base} V${y + r} Q${x0},${y} ${x0 + r},${y} H${x1 - r} Q${x1},${y} ${x1},${y + r} V${base} Z` });
    const val = rot
      ? sv('text', { x: cx + 3.5, y: y - 5, 'text-anchor': 'start', fill: 'var(--ink)', 'font-size': 10.5, 'font-family': 'var(--mono)', 'font-weight': 500, transform: `rotate(-90 ${cx + 3.5} ${y - 5})` })
      : sv('text', { x: cx, y: y - 6, 'text-anchor': 'middle', fill: 'var(--ink)', 'font-size': 10.5, 'font-family': 'var(--mono)', 'font-weight': 500 });
    val.textContent = h.f(x.v);
    const lab = sv('text', { x: cx + 3, y: base + 14, 'text-anchor': 'end', fill: 'var(--ink-2)', 'font-size': 11, transform: `rotate(-45 ${cx + 3} ${base + 14})` });
    lab.textContent = x.m.name + (x.m.stopped ? ' *' : '');
    const show = () => { bar.classList.add('hot'); showHTip(x, h, hit); };
    const hide = () => { bar.classList.remove('hot'); hideHTip(); };
    hit.addEventListener('pointerenter', show);
    hit.addEventListener('pointerleave', hide);
    hit.addEventListener('focus', show);
    hit.addEventListener('blur', hide);
    g.append(hit, bar, val, lab);
    svg.append(g);
  });
  box.append(svg);
}

function showHTip(x, h, node) {
  const tip = document.getElementById('htip');
  tip.replaceChildren();
  const m = x.m;
  const head = el('div');
  head.append(el('div', { class: 't-name' }, m.name), el('div', { class: 't-var' }, `${(m.variant || 'default').toUpperCase()}${m.provider ? ' · ' + m.provider : ''}`));
  tip.append(head, el('div', { class: 't-score' }, (h.tipF ?? h.f)(x.v)));
  const dl = el('dl');
  const row = (k, v) => dl.append(el('dt', {}, k), el('dd', {}, v));
  row('Nota', fmt.score(scoreOf(m)));
  row('Suite oculta', m.hidden ? `${m.hidden.passed}/${m.hidden.total}` : '—');
  row('Coste', fmt.cost(m.cost));
  row('Tokens / s', m.tokensOut && m.activeMs ? nf(0).format(m.tokensOut / (m.activeMs / 1000)) : '—');
  row('Tiempo activo', fmt.time(m.activeMs));
  tip.append(dl);
  tip.hidden = false;
  const sec = tip.parentElement.getBoundingClientRect(), b = node.getBoundingClientRect();
  let left = b.left - sec.left + b.width / 2 + 12;
  if (left + tip.offsetWidth > sec.width - 8) left = b.left - sec.left + b.width / 2 - tip.offsetWidth - 12;
  tip.style.left = `${Math.max(8, left)}px`;
  tip.style.top = `${Math.max(40, b.top - sec.top + 20)}px`;
}
function hideHTip() {
  const t = document.getElementById('htip');
  if (t) t.hidden = true;
}

function render() {
  drawHighlights();
  const xm = X[state.x], ym = Y[state.y];
  document.getElementById('chart-title').textContent = `${cur.short ?? cur.test} · ${ym.title}${isCustom() && state.y === 'score' ? ' con tus pesos' : ''} frente a ${xm.title}`;
  points = cur.models
    .map((m) => ({ m, x: xm.get(m), y: ym.get(m) }))
    .filter((p) => p.x != null && p.y != null && (!state.log || p.x > 0));
  front = frontier(points);
  drawChart(xm, ym);
  drawTable();
}

// ---------- gráfico ----------
const measureCtx = document.createElement('canvas').getContext('2d');
function textW(t, font) { measureCtx.font = font; return measureCtx.measureText(t).width; }

function drawChart(xm, ym) {
  const box = document.getElementById('chart');
  box.replaceChildren();
  hideTip();
  if (!points.length) {
    box.append(el('div', { class: 'empty' }, 'Todavía no hay modelos con nota en esta prueba.'));
    return;
  }
  const W = Math.max(320, box.clientWidth), H = W < 640 ? 440 : 560;
  // Margen derecho amplio: con el eje invertido, los modelos más baratos quedan en el borde derecho y sus
  // etiquetas necesitan sitio fuera del área de datos.
  const M = { top: 34, right: W < 640 ? 96 : 150, bottom: 58, left: 58 };
  const pw = W - M.left - M.right, ph = H - M.top - M.bottom;

  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  let x0, x1, sx, xt;
  if (state.log) {
    x0 = Math.min(...xs) / 1.6; x1 = Math.max(...xs) * 1.6;
    const l0 = Math.log10(x0), l1 = Math.log10(x1);
    sx = (v) => M.left + (1 - (Math.log10(v) - l0) / (l1 - l0)) * pw; // invertido: más caro a la izquierda
    xt = logTicks(x0, x1);
  } else {
    x0 = 0; x1 = Math.max(...xs) * 1.1;
    const st = niceStep(x1, 5); x1 = Math.ceil(x1 / st) * st;
    sx = (v) => M.left + (1 - (v - x0) / (x1 - x0)) * pw;
    xt = linTicks(x0, x1, 5);
  }
  const yMax = ym.max, ySt = niceStep(yMax - Math.min(...ys), 6);
  const y0 = Math.max(0, Math.floor((Math.min(...ys) - ySt) / ySt) * ySt), y1 = yMax;
  const sy = (v) => M.top + (1 - (v - y0) / (y1 - y0)) * ph;
  const yt = linTicks(y0, y1, 6);

  const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `${ym.title} frente a ${xm.title}. La tabla inferior contiene los mismos datos.` });
  const g = sv('g');

  for (const v of yt) {
    g.append(sv('line', { x1: M.left, x2: M.left + pw, y1: sy(v), y2: sy(v), stroke: 'var(--grid)', 'stroke-width': 1 }));
    const t = sv('text', { x: M.left - 10, y: sy(v) + 4, 'text-anchor': 'end', fill: 'var(--muted)', 'font-size': 11, 'font-family': 'var(--mono)' });
    t.textContent = state.y === 'hidden' ? `${v} %` : String(v);
    g.append(t);
  }
  for (const v of xt) {
    g.append(sv('line', { x1: sx(v), x2: sx(v), y1: M.top, y2: M.top + ph, stroke: 'var(--grid)', 'stroke-width': 1 }));
    const t = sv('text', { x: sx(v), y: M.top + ph + 20, 'text-anchor': 'middle', fill: 'var(--muted)', 'font-size': 11, 'font-family': 'var(--mono)' });
    t.textContent = xm.f(v);
    g.append(t);
  }
  g.append(sv('line', { x1: M.left, x2: M.left + pw, y1: M.top + ph, y2: M.top + ph, stroke: 'var(--axis)', 'stroke-width': 1 }));

  const xl = sv('text', { x: M.left + pw / 2, y: H - 12, 'text-anchor': 'middle', fill: 'var(--ink-2)', 'font-size': 12 });
  xl.textContent = `${xm.label} (${xm.unit}) · menos es mejor →`;
  g.append(xl);
  const eff = sv('text', { x: M.left + pw, y: M.top - 14, 'text-anchor': 'end', fill: 'var(--muted)', 'font-size': 12, 'font-style': 'italic' });
  eff.textContent = 'más eficiente ↗';
  g.append(eff);

  // Línea de la frontera.
  const fp = points.filter((p) => front.has(p.m.slug)).sort((a, b) => a.x - b.x);
  if (fp.length > 1) {
    g.append(sv('polyline', {
      points: fp.map((p) => `${sx(p.x)},${sy(p.y)}`).join(' '),
      fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
    }));
  }

  // Puntos: primero el resto, encima la frontera.
  const ordered = [...points].sort((a, b) => front.has(a.m.slug) - front.has(b.m.slug));
  for (const p of ordered) {
    p.px = sx(p.x); p.py = sy(p.y);
    const isF = front.has(p.m.slug);
    const pt = sv('g', { class: 'pt', tabindex: 0, role: 'img', 'aria-label': `${p.m.name}: ${ym.label} ${ym.f(p.y)}, ${xm.label.toLowerCase()} ${xm.f(p.x)}${isF ? ', en la frontera de eficiencia' : ''}` });
    pt.append(sv('circle', { cx: p.px, cy: p.py, r: 12, fill: 'transparent' }));
    const c = sv('circle', { class: 'mark', cx: p.px, cy: p.py, r: 5, fill: isF ? 'var(--accent)' : 'var(--rest)', stroke: 'var(--surface)', 'stroke-width': 2 });
    pt.append(c);
    pt.addEventListener('focus', () => showTip(p, xm, ym));
    pt.addEventListener('blur', hideTip);
    p.node = c;
    g.append(pt);
  }

  // Etiquetas con evitación de choques; si no caben, quedan en tooltip y tabla.
  const nameFont = '500 12px "IBM Plex Sans", system-ui, sans-serif';
  const varFont = '500 10px "IBM Plex Mono", ui-monospace, monospace';
  const taken = points.map((p) => ({ x0: p.px - 7, x1: p.px + 7, y0: p.py - 7, y1: p.py + 7 }));
  const free = (b) =>
    b.x0 >= M.left && b.x1 <= W - 4 && b.y0 >= M.top - 4 && b.y1 <= M.top + ph &&
    !taken.some((o) => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0);
  const byPriority = [...points].sort((a, b) => front.has(b.m.slug) - front.has(a.m.slug) || b.y - a.y);
  for (const p of byPriority) {
    const variant = (p.m.variant || 'default').toUpperCase();
    const w = Math.max(textW(p.m.name + (p.m.stopped ? ' *' : ''), nameFont), textW(variant, varFont) * 1.06) + 2;
    const h = 26;
    const tries = [
      { ax: 'start', x: p.px + 9, y: p.py - 11 },
      { ax: 'end', x: p.px - 9, y: p.py - 11 },
      { ax: 'middle', x: p.px, y: p.py - 36 },
      { ax: 'middle', x: p.px, y: p.py + 10 },
      { ax: 'start', x: p.px + 9, y: p.py - 26 },
      { ax: 'end', x: p.px - 9, y: p.py - 26 },
      { ax: 'start', x: p.px + 9, y: p.py + 2 },
      { ax: 'end', x: p.px - 9, y: p.py + 2 },
      // Más lejos, con línea guía, para los puntos apiñados.
      ...[[30, -38], [30, 14], [-30, -38], [-30, 14], [44, -62], [44, 38], [-44, -62], [-44, 38]].map(([dx, dy]) => (
        { ax: dx > 0 ? 'start' : 'end', x: p.px + dx, y: p.py + dy, lead: true }
      )),
    ];
    for (const t of tries) {
      const bx0 = t.ax === 'start' ? t.x : t.ax === 'end' ? t.x - w : t.x - w / 2;
      const b = { x0: bx0 - 2, x1: bx0 + w + 2, y0: t.y - 1, y1: t.y + h + 1 };
      if (!free(b)) continue;
      taken.push(b);
      if (t.lead) {
        // La guía va del borde del punto a la línea del nombre, sin tocar el texto.
        const ty = t.y + 7, tx = t.ax === 'start' ? t.x - 3 : t.x + 3;
        const ang = Math.atan2(ty - p.py, tx - p.px);
        g.append(sv('line', {
          x1: p.px + Math.cos(ang) * 8, y1: p.py + Math.sin(ang) * 8, x2: tx, y2: ty,
          stroke: 'var(--axis)', 'stroke-width': 1,
        }));
      }
      const n = sv('text', { x: t.x, y: t.y + 11, 'text-anchor': t.ax, fill: 'var(--ink)', 'font-size': 12, 'font-weight': 500, 'font-family': 'var(--sans)' });
      n.textContent = p.m.name + (p.m.stopped ? ' *' : '');
      const v = sv('text', { x: t.x, y: t.y + 23, 'text-anchor': t.ax, fill: 'var(--muted)', 'font-size': 10, 'font-weight': 500, 'font-family': 'var(--mono)', 'letter-spacing': '0.06em' });
      v.textContent = variant;
      g.append(n, v);
      break;
    }
  }

  // Capa de hover: el punto más cercano (radio 48 px), no hace falta acertar en el círculo.
  const hit = sv('rect', { x: M.left, y: M.top, width: pw, height: ph, fill: 'transparent' });
  hit.addEventListener('pointermove', (e) => {
    const r = svg.getBoundingClientRect(), k = W / r.width;
    const mx = (e.clientX - r.left) * k, my = (e.clientY - r.top) * k;
    let best = null, bd = 48;
    for (const p of points) { const d = Math.hypot(p.px - mx, p.py - my); if (d < bd) { bd = d; best = p; } }
    best ? showTip(best, xm, ym) : hideTip();
  });
  hit.addEventListener('pointerleave', hideTip);
  svg.append(g, hit); // la capa de hover encima; los puntos siguen accesibles con el teclado
  box.append(svg);
  box._svg = svg; box._W = W;
}

let hot = null;
function showTip(p, xm, ym) {
  if (hot && hot !== p) hot.node.setAttribute('r', 5);
  hot = p;
  p.node.setAttribute('r', 7);
  const tip = document.getElementById('tip');
  tip.replaceChildren();
  const m = p.m;
  const head = el('div');
  head.append(el('div', { class: 't-name' }, m.name), el('div', { class: 't-var' }, (m.variant || 'default').toUpperCase()));
  tip.append(head);
  tip.append(el('div', { class: 't-score' }, ym.f(p.y)));
  const dl = el('dl');
  const row = (k, v) => dl.append(el('dt', {}, k), el('dd', {}, v));
  if (state.y !== 'score') row('Nota', fmt.score(m.score));
  row('Suite oculta', m.hidden ? `${m.hidden.passed}/${m.hidden.total}` : '—');
  row('Código · tests (juez)', m.code != null ? `${m.code} · ${m.tests}` : '—');
  row('Coste', fmt.cost(m.cost));
  row('Tokens generados', fmt.tokens(m.tokensOut));
  row('Pasos', fmt.steps(m.steps));
  row('Tiempo activo', fmt.time(m.activeMs));
  row('Intervenciones', m.interventions ?? '—');
  tip.append(dl);
  if (m.categories) tip.append(el('div', { class: 't-cats' }, m.categories));
  if (m.stopped) tip.append(el('div', { class: 't-cats' }, `* No terminó${m.progress != null ? ` (≈${m.progress} % hecho)` : ''}: ${m.stopped}`));
  if (front.has(m.slug)) {
    const f = el('div', { class: 't-front' });
    f.append(el('span', { class: 'dot front' }), 'En la frontera de eficiencia');
    tip.append(f);
  }
  tip.hidden = false;
  const card = tip.parentElement, box = document.getElementById('chart');
  const k = box.getBoundingClientRect().width / box._W;
  const cx = box.offsetLeft + p.px * k, cy = box.offsetTop + p.py * k;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = cx + 16, top = cy - th / 2;
  if (left + tw > card.clientWidth - 8) left = cx - tw - 16;
  top = Math.max(8, Math.min(top, card.clientHeight - th - 8));
  tip.style.left = `${Math.max(8, left)}px`;
  tip.style.top = `${top}px`;
}
function hideTip() {
  if (hot) hot.node.setAttribute('r', 5);
  hot = null;
  document.getElementById('tip').hidden = true;
}

// ---------- tabla ----------
const STATUS = {
  scored: ['ok', 'Evaluado'],
  zero: ['bad', 'Sin proyecto'],
  forbidden: ['bad', 'Motor prohibido'],
  unjudged: ['warn', 'Pendiente de juez'],
  stopped: ['warn', 'No terminó (*)'],
  running: ['run', 'Ejecutando'],
  quota: ['warn', 'Cortado por cuota'],
  access: ['warn', 'Sin acceso al modelo'],
  pending: ['', 'Pendiente'],
};
const COLS = [
  { k: 'rank', label: '#', sort: false },
  { k: 'name', label: 'Modelo', get: (m) => m.name.toLowerCase() },
  { k: 'score', label: 'Nota', get: (m) => scoreOf(m) },
  { k: 'hidden', label: 'Suite oculta', get: (m) => (m.hidden ? m.hidden.passed / m.hidden.total : null) },
  { k: 'code', label: 'Código', get: (m) => m.code },
  { k: 'tests', label: 'Tests', get: (m) => m.tests },
  { k: 'cost', label: 'Coste', get: (m) => m.cost },
  { k: 'tokens', label: 'Tokens', get: (m) => m.tokensOut },
  { k: 'steps', label: 'Pasos', get: (m) => m.steps },
  { k: 'time', label: 'Tiempo', get: (m) => m.activeMs },
  { k: 'status', label: 'Estado', get: (m) => m.status },
];

// Orden de la clasificación: nota (con los pesos elegidos); en empate, nota oficial, menor coste y nombre.
function byRank(a, b) {
  return (scoreOf(b) ?? -1) - (scoreOf(a) ?? -1) || (b.score ?? -1) - (a.score ?? -1) ||
    (a.cost ?? Infinity) - (b.cost ?? Infinity) || a.name.localeCompare(b.name);
}

function drawTable() {
  const head = document.getElementById('thead');
  head.replaceChildren();
  for (const c of COLS) {
    const th = el('th', { scope: 'col' });
    if (c.sort === false) th.textContent = c.label;
    else {
      const b = el('button', { type: 'button' }, c.label);
      if (state.sort === c.k) b.setAttribute('data-dir', state.dir < 0 ? '↓' : '↑');
      b.addEventListener('click', () => {
        state.dir = state.sort === c.k ? -state.dir : c.k === 'name' || c.k === 'cost' || c.k === 'tokens' || c.k === 'steps' || c.k === 'time' ? 1 : -1;
        state.sort = c.k;
        drawTable();
      });
      th.append(b);
      th.setAttribute('aria-sort', state.sort === c.k ? (state.dir < 0 ? 'descending' : 'ascending') : 'none');
    }
    head.append(th);
  }
  const col = COLS.find((c) => c.k === state.sort);
  const rows = [...cur.models].sort((a, b) => {
    const va = col.get(a), vb = col.get(b);
    if (va == null && vb == null) return a.name.localeCompare(b.name);
    if (va == null) return 1;
    if (vb == null) return -1;
    return (va < vb ? -1 : va > vb ? 1 : 0) * state.dir || byRank(a, b);
  });
  const body = document.getElementById('tbody');
  body.replaceChildren();
  const rankOf = new Map([...cur.models].filter((m) => scoreOf(m) != null).sort(byRank).map((m, i) => [m.slug, i + 1]));
  for (const m of rows) {
    const tr = el('tr');
    tr.append(el('td', { class: 'rank' }, rankOf.get(m.slug) ?? ''));
    const n = el('td');
    const inChart = points.some((p) => p.m.slug === m.slug);
    n.append(el('span', { class: 'dot' + (front.has(m.slug) ? ' front' : ''), style: inChart ? '' : 'visibility:hidden', 'aria-hidden': 'true' }), ' ');
    n.append(el('span', { class: 'm-name' }, m.name), el('span', { class: 'm-var' }, (m.variant || 'default').toUpperCase()));
    tr.append(n);
    tr.append(el('td', { class: 'num score' }, fmt.score(scoreOf(m)) + (m.stopped && scoreOf(m) != null ? '*' : '')));
    tr.append(el('td', { class: 'num' }, m.hidden ? `${m.hidden.passed}/${m.hidden.total}` : '—'));
    tr.append(el('td', { class: 'num' }, m.code ?? '—'));
    tr.append(el('td', { class: 'num' }, m.tests ?? '—'));
    tr.append(el('td', { class: 'num' }, fmt.cost(m.cost)));
    tr.append(el('td', { class: 'num' }, fmt.tokens(m.tokensOut)));
    tr.append(el('td', { class: 'num' }, fmt.steps(m.steps)));
    tr.append(el('td', { class: 'num' }, fmt.time(m.activeMs)));
    const [cls, txt0] = STATUS[m.status] ?? ['', m.status];
    const txt = m.status === 'stopped' && m.progress != null ? `No terminó (≈${m.progress} %) *` : txt0;
    const st = el('td');
    st.append(el('span', { class: 'pill ' + cls }, txt));
    tr.append(st);
    body.append(tr);
  }
}

// ---------- notas ----------
function notes() {
  const f = document.getElementById('notes');
  f.replaceChildren();
  const W = cur.weights;
  const lines = [
    `Nota 0–10 = corrección ${W.correctness} (suite oculta de ${cur.hiddenTotal} casos) + autonomía ${W.autonomy} + tests propios ${W.ownTests} + código ${W.codeQuality} + robustez ${W.robustness}, según RUBRIC.md de la prueba.`,
    'Frontera de eficiencia: modelos que ningún otro supera a la vez en el eje Y y en el eje X elegidos. Cambia al cambiar de eje.',
    'Coste: precio de lista que registra opencode por sesión (con la suscripción Go es orientativo). Tokens generados: salida + razonamiento. Pasos: llamadas al modelo. Tiempo: tiempo activo del agente.',
    'Cada modelo usa su variante de razonamiento más alta disponible (etiqueta bajo el nombre).',
    ...(DATA.notes ?? []),
  ];
  const stopped = cur.models.filter((m) => m.stopped);
  if (stopped.length) lines.push(`* No terminó: ${stopped.map((m) => `${m.name}${m.progress != null ? ` (≈${m.progress} % hecho)` : ''} — ${m.stopped}`).join('; ')}. Se valora el código tal como estaba al detenerlo; autonomía 0.`);
  for (const l of lines) f.append(el('div', {}, l));
  if (DATA.repoUrl) {
    const r = el('div');
    r.append('La suite oculta no se publica. Código, soluciones de los modelos y datos: ', el('a', { href: DATA.repoUrl }, 'repositorio en GitHub'), '.');
    f.append(r);
  }
}

function selectTest(t) {
  if (t === cur) return;
  cur = t;
  history.replaceState(null, '', '#' + t.test);
  header();
  controls();
  weightsPanel();
  render();
  notes();
}
window.addEventListener('hashchange', () => { const t = TESTS.find((x) => '#' + x.test === location.hash); if (t) selectTest(t); });

header();
controls();
weightsPanel();
render();
notes();
let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 120); });
document.fonts?.ready.then(render);
</script>
